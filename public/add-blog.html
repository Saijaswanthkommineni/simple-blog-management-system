<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog | Add Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h1>Simple Blog</h1>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/add-blog.html">Add Blog</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="add-blog">
            <h2>Add a New Blog</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="blog-title">Blog Title:</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        <input 
                            type="text" 
                            id="blog-title" 
                            name="blog-title" 
                            placeholder="Enter your blog title" 
                            required
                            aria-describedby="blog-title-error"
                        >
                    </div>
                    <span class="error" id="blog-title-error" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="author-name">Author Name:</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <input 
                            type="text" 
                            id="author-name" 
                            name="author-name" 
                            placeholder="Enter your name" 
                            required
                            aria-describedby="author-name-error"
                        >
                    </div>
                    <span class="error" id="author-name-error" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="blog-content">Blog Content:</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <textarea 
                            id="blog-content" 
                            name="blog-content" 
                            placeholder="Write your blog content here..." 
                            required
                            aria-describedby="blog-content-error"
                        ></textarea>
                    </div>
                    <span class="error" id="blog-content-error" role="alert" aria-live="polite"></span>
                </div>

                <button type="submit">Publish Blog</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Simple Blog Management System &copy; 2026</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
